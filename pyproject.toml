[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "paperbot"
version = "0.1.0"
description = "Answers colleagues' paper requests by email: finds the PDF (open access first, then via institute VPN) and mails it back."
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.28",
    "playwright>=1.40",
    "tomlkit>=0.12",
    "keyring>=24",
    "sv-ttk>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
paperbot = "paperbot.cli:main"

[project.gui-scripts]
paperbot-app = "paperbot.gui:main"

[tool.setuptools]
packages = ["paperbot", "paperbot.gui"]

[tool.setuptools.package-data]
paperbot = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
